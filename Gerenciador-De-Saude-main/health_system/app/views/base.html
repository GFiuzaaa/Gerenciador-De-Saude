<!DOCTYPE html>
{% set current_theme = request.cookies.get('theme', 'light') %}
<html lang="pt-br" data-theme="{{ current_theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Saúde</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <span>🌿</span> HealthSystem
        </div>
        <div class="user-info">
            <!-- Botão de tema usando expressão inline do Jinja (sem blocos if/endif complexos) -->
            <button onclick="toggleTheme()" class="btn-theme">
                {{ '☀️ Modo Claro' if current_theme == 'dark' else '🌙 Modo Escuro' }}
            </button>

            {% if 'usuario_logado' in session %}
            <span>Olá, <strong>{{ session.get('nome_usuario') }}</strong></span>
            <a href="{{ url_for('auth.logout') }}" class="btn">Sair</a>
            {% endif %}
        </div>
    </header>

    <div class="container {% if 'usuario_logado' in session and request.endpoint == 'auth.dashboard' %}container-dashboard{% endif %}">
        {% block content %}{% endblock %}
    </div>

    <!-- Script JavaScript para manipular o Cookie de Tema -->
    <script>
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
            }
            return null;
        }

        function toggleTheme() {
            let currentTheme = getCookie('theme') || 'light';
            let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setCookie('theme', newTheme, 365);
            location.reload();
        }
    </script>
</body>
</html>
