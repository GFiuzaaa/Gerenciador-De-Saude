{% extends "base.html" %}
{% block content %}
<h2>Entrar no Sistema</h2>

{% set messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
  {% for category, message in messages %}
    <div class="alert">{{ message }}</div>
  {% endfor %}
{% endif %}

<form method="POST">
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required placeholder="joao@teste.com">

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" required placeholder="123456">

    <button type="submit" class="btn btn-primary">Entrar</button>
</form>

<div class="login-hints">
    Não tem uma conta? <a href="{{ url_for('auth.cadastro') }}" style="color: var(--primary); font-weight: bold;">Cadastre-se aqui</a>.
</div>
{% endblock %}
