{% extends "base.html" %}
{% block content %}
<h2>Criar Nova Conta</h2>

{% set messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
  {% for category, message in messages %}
    <div class="alert">{{ message }}</div>
  {% endfor %}
{% endif %}

<form method="POST">
    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome" required placeholder="Ex: Carlos Andrade">

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required placeholder="seuemail@teste.com">

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" required placeholder="Sua senha">

    <label for="confirmar_senha">Confirmar Senha:</label>
    <input type="password" id="confirmar_senha" name="confirmar_senha" required placeholder="Repita a senha">

    <button type="submit" class="btn btn-primary">Cadastrar</button>
</form>

<div class="login-hints">
    Já possui uma conta? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: bold;">Faça Login aqui</a>.
</div>
{% endblock %}
